<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1220" />
  <title>正在加载游戏 · 小咪 Hack Roms</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#080e19;color:#e6ecf4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#game{position:absolute;inset:0;width:100%;height:100%;height:100dvh}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101a2b;z-index:10;text-align:center;padding:24px}#status.hidden{display:none}.message{max-width:520px}.symbol{display:flex;justify-content:center;align-items:center;background:#193246;border:1px solid #285568;color:#64e8c8;font-size:28px;font-weight:900;border-radius:16px;width:62px;height:62px;margin:0 auto 23px}h1{font-size:22px;margin:0 0 12px}p{margin:0 0 22px;color:#aab9cc;line-height:1.8;font-size:13px;overflow-wrap:anywhere}code{font-size:12px;color:#7de5cc;background:#172d39;border-radius:5px;padding:3px 5px}button{cursor:pointer;border:1px solid #587081;background:#24394e;color:#dce9fb;border-radius:9px;font-weight:750;font-size:13px;padding:12px 18px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}a{display:inline-flex;align-items:center;justify-content:center;background:#2ce1bd;border-radius:9px;color:#0c2731;font-weight:800;font-size:13px;text-decoration:none;padding:12px 19px}.hint{font-size:11px;color:#8393a8;margin-top:19px;line-height:1.8}.spinner{border:3px solid rgba(255,255,255,.08);border-top-color:#2ce1bd;border-radius:50%;width:29px;height:29px;margin:0 auto 22px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="game" aria-label="游戏模拟器"></div>
  <div id="status" role="status" aria-live="polite"><div class="message"><div class="spinner"></div><h1>正在准备模拟器...</h1><p>正在读取游戏配置和 ROM 文件，请稍候。</p></div></div>
  <script type="module" src="/src/player.js"></script>
</body>
</html>
